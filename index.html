<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MHP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <main class="app">
      <header class="hero">
        <p class="kicker">MHP</p>
        <h1>Manatee Holiday Planner 🐳🏖️</h1>
      </header>

      <section class="panel">
        <div class="calendar-controls top-year-controls">
          <button id="prev-year" type="button">Previous Year</button>
          <h3 id="planner-year"></h3>
          <button id="next-year" type="button">Next Year</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Holidays</h2>
          <button id="open-allowance" type="button">Allowance</button>
        </div>
        <div id="allowance-summary"></div>
        <div id="holiday-heatmap"></div>
      </section>

      <section class="panel" aria-labelledby="holiday-heading">
        <div class="panel-head">
          <h2 id="holiday-heading">Add Holiday</h2>
        </div>
        <form id="holiday-form" class="grid-form" autocomplete="off" onsubmit="event.preventDefault(); return false;">
          <label>
            Trip / Location
            <input type="text" name="location" placeholder="e.g. Athens" required />
          </label>
          <label>
            Country
            <select name="country" id="add-country" required></select>
          </label>
          <label>
            Start date
            <input type="date" name="startDate" required />
          </label>
          <label>
            End date (optional)
            <input type="date" name="endDate" />
          </label>
          <label>
            Days off work
            <input type="number" name="daysOffWork" min="0.5" step="0.5" placeholder="e.g. 5" />
          </label>
          <label>
            Status
            <select name="status" required>
              <option value="ideation">Ideation</option>
              <option value="planning">Planning</option>
              <option value="booked">Booked</option>
              <option value="happened">Happened</option>
            </select>
          </label>
          <label class="full-width">
            Who is taking this holiday?
            <div id="people-checkboxes" class="checkbox-wrap"></div>
          </label>
          <button type="submit">Add Holiday</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="views-heading">
        <div class="panel-head">
          <h2 id="views-heading">Planner View</h2>
          <div class="toggle" role="tablist" aria-label="View toggle">
            <button id="table-tab" class="active" data-view="table" role="tab" aria-selected="true">Table</button>
            <button id="calendar-tab" data-view="calendar" role="tab" aria-selected="false">Calendar</button>
          </div>
        </div>

        <div id="table-view">
          <div id="holiday-table"></div>
        </div>

        <div id="calendar-view" class="hidden">
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
      </section>
    </main>

    <div id="allowance-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="allowance-heading">
      <div class="modal-card">
        <div class="panel-head">
          <h2 id="allowance-heading">Allowance Setup</h2>
          <button id="allowance-cancel" type="button">Close</button>
        </div>
        <form id="person-form" class="grid-form" autocomplete="off" onsubmit="event.preventDefault(); return false;">
          <label>
            Person
            <input type="text" name="name" placeholder="e.g. Ben" required />
          </label>
          <label>
            Standard days
            <input type="number" name="standard" min="0" step="0.5" value="28" required />
          </label>
          <label>
            Additional days
            <input type="number" name="additional" min="0" step="0.5" value="0" required />
          </label>
          <button type="submit">Add / Update Person</button>
        </form>
        <div id="people-summary"></div>
      </div>
    </div>

    <div id="edit-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="edit-holiday-title">
      <div class="modal-card">
        <div class="panel-head">
          <h2 id="edit-holiday-title">Edit Holiday</h2>
          <button id="edit-cancel" type="button">Close</button>
        </div>
        <form id="edit-holiday-form" class="grid-form" autocomplete="off" onsubmit="event.preventDefault(); return false;">
          <input type="hidden" name="holidayId" />
          <label>
            Trip / Location
            <input type="text" name="location" required />
          </label>
          <label>
            Country
            <select name="country" id="edit-country" required></select>
          </label>
          <label>
            Start date
            <input type="date" name="startDate" required />
          </label>
          <label>
            End date
            <input type="date" name="endDate" required />
          </label>
          <label>
            Days off work
            <input type="number" name="daysOffWork" min="0.5" step="0.5" required />
          </label>
          <label>
            Status
            <select name="status" required>
              <option value="ideation">Ideation</option>
              <option value="planning">Planning</option>
              <option value="booked">Booked</option>
              <option value="happened">Happened</option>
            </select>
          </label>
          <button type="submit">Save Changes</button>
        </form>
      </div>
    </div>

    <template id="month-template">
      <article class="month-card">
        <h4></h4>
        <div class="days-header">
          <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
        </div>
        <div class="days-grid"></div>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js?v=20260509-14"></script>
  </body>
</html>
