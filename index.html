<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MHP 🐳🏖️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <main class="app">
      <header class="hero">
        <p class="kicker">MHP</p>
        <h1>Manatee Holiday Planner 🐳🏖️</h1>
        <p id="next-big-holiday-hero" class="next-big-holiday-hero"></p>
      </header>

      <section class="panel">
        <div class="calendar-controls top-year-controls">
          <div class="year-nav">
            <label for="year-select" class="year-select-label">Year</label>
            <select id="year-select" aria-label="Select year"></select>
          </div>
          <h3 id="planner-year"></h3>
          <div>
            <button id="open-add-holiday" type="button">Add Holiday</button>
            <button id="open-allowance" type="button">Year Allowance</button>
            <button id="open-bank-holidays" type="button">Bank Holidays</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Holidays</h2>
        </div>
        <div id="allowance-summary"></div>
        <div id="holiday-heatmap"></div>
        <div id="holiday-todos"></div>
      </section>

      <section class="panel" aria-labelledby="views-heading">
        <div class="panel-head">
          <div class="planner-heading">
            <h2 id="views-heading">Planner View</h2>
            <label class="hide-completed-toggle" for="hide-completed">
              <input id="hide-completed" type="checkbox" />
              Hide completed
            </label>
          </div>
          <div class="toggle" role="tablist" aria-label="View toggle">
            <button id="table-tab" class="active" data-view="table" role="tab" aria-selected="true">Table</button>
            <button id="calendar-tab" data-view="calendar" role="tab" aria-selected="false">Calendar</button>
          </div>
        </div>

        <div id="table-view">
          <div id="holiday-table"></div>
        </div>

        <div id="calendar-view" class="hidden">
          <div id="calendar-grid" class="calendar-grid"></div>
        </div>
      </section>

      <div class="utility-actions">
        <button id="open-people" class="secondary-utility-btn" type="button">People Setup</button>
      </div>

    </main>

    <div id="people-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="people-heading">
      <div class="modal-card">
        <div class="panel-head">
          <h2 id="people-heading">People Setup</h2>
          <button id="people-cancel" type="button">Close</button>
        </div>
        <p>Add/remove people shared across all years.</p>
        <form id="people-form" class="grid-form" autocomplete="off" onsubmit="event.preventDefault(); return false;">
          <label>
            Person
            <input type="text" name="name" placeholder="e.g. Ben" required />
          </label>
          <button type="submit">Add Person</button>
        </form>
        <div id="people-list"></div>
      </div>
    </div>

    <div id="allowance-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="allowance-heading">
      <div class="modal-card">
        <div class="panel-head">
          <h2 id="allowance-heading">Year Allowance</h2>
          <button id="allowance-cancel" type="button">Close</button>
        </div>
        <p>Set allowance values for <strong id="allowance-year-label"></strong>.</p>
        <form id="person-form" class="grid-form" autocomplete="off" onsubmit="event.preventDefault(); return false;">
          <label>
            Person
            <select name="name" id="allowance-person" required></select>
          </label>
          <label>
            Standard days
            <input type="number" name="standard" min="0" step="0.5" value="28" required />
          </label>
          <label>
            Additional days
            <input type="number" name="additional" min="0" step="0.5" value="0" required />
          </label>
          <button type="submit">Add / Update Person</button>
        </form>
        <div id="people-summary"></div>
      </div>
    </div>

    <div id="add-holiday-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="holiday-heading">
      <div class="modal-card">
        <div class="panel-head">
          <h2 id="holiday-heading">Add Holiday</h2>
          <button id="add-holiday-cancel" type="button">Close</button>
        </div>
        <form id="holiday-form" class="grid-form" autocomplete="off" onsubmit="event.preventDefault(); return false;">
          <div class="form-row">
            <label>
              Trip / Location
              <input type="text" name="location" placeholder="e.g. Athens" required />
            </label>
            <label>
              Country
              <select name="country" id="add-country" required></select>
            </label>
          </div>
          <div class="form-row halfday-row">
            <label>
              Start date
              <input type="date" name="startDate" required />
            </label>
            <label>
              Start half day
              <span class="half-toggle" role="radiogroup" aria-label="Start half day">
                <label><input type="radio" name="startHalf" value="am" checked required /><span>AM</span></label>
                <label><input type="radio" name="startHalf" value="pm" required /><span>PM</span></label>
              </span>
            </label>
          </div>
          <div class="form-row halfday-row">
            <label>
              End date
              <input type="date" name="endDate" required />
            </label>
            <label>
              End half day
              <span class="half-toggle" role="radiogroup" aria-label="End half day">
                <label><input type="radio" name="endHalf" value="am" required /><span>AM</span></label>
                <label><input type="radio" name="endHalf" value="pm" checked required /><span>PM</span></label>
              </span>
            </label>
          </div>
          <label>
            Status
            <span class="tri-toggle" role="radiogroup" aria-label="Status">
              <label><input type="radio" name="status" value="planning" checked required /><span>Planning</span></label>
              <label><input type="radio" name="status" value="booked" required /><span>Booked</span></label>
              <label><input type="radio" name="status" value="happened" required /><span>Happened</span></label>
            </span>
          </label>
          <label class="full-width">
            Who is taking this holiday?
            <div id="people-checkboxes" class="checkbox-wrap"></div>
          </label>
          <div class="form-row days-summary-row">
            <label>
              Total days
              <input type="number" name="tripLength" min="0.5" step="0.5" readonly />
            </label>
            <label>
              Days off work
              <input type="number" name="daysOffWork" min="0" step="0.5" readonly />
            </label>
          </div>
          <div id="holiday-allowance-warning" class="allowance-warning hidden" aria-live="polite"></div>
          <button type="submit">Add Holiday</button>
        </form>
      </div>
    </div>

    <div id="edit-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="edit-holiday-title">
      <div class="modal-card">
        <div class="panel-head">
          <h2 id="edit-holiday-title">Edit Holiday</h2>
          <button id="edit-cancel" type="button">Close</button>
        </div>
        <form id="edit-holiday-form" class="grid-form" autocomplete="off" onsubmit="event.preventDefault(); return false;">
          <input type="hidden" name="holidayId" />
          <div class="form-row">
            <label>
              Trip / Location
              <input type="text" name="location" required />
            </label>
            <label>
              Country
              <select name="country" id="edit-country" required></select>
            </label>
          </div>
          <div class="form-row halfday-row">
            <label>
              Start date
              <input type="date" name="startDate" required />
            </label>
            <label>
              Start half day
              <span class="half-toggle" role="radiogroup" aria-label="Edit start half day">
                <label><input type="radio" name="startHalf" value="am" checked required /><span>AM</span></label>
                <label><input type="radio" name="startHalf" value="pm" required /><span>PM</span></label>
              </span>
            </label>
          </div>
          <div class="form-row halfday-row">
            <label>
              End date
              <input type="date" name="endDate" required />
            </label>
            <label>
              End half day
              <span class="half-toggle" role="radiogroup" aria-label="Edit end half day">
                <label><input type="radio" name="endHalf" value="am" required /><span>AM</span></label>
                <label><input type="radio" name="endHalf" value="pm" checked required /><span>PM</span></label>
              </span>
            </label>
          </div>
          <label class="full-width">
            Who is taking this holiday?
            <div id="edit-people-checkboxes" class="checkbox-wrap"></div>
          </label>
          <div class="form-row days-summary-row">
            <label>
              Total days
              <input type="number" name="tripLength" min="0.5" step="0.5" readonly />
            </label>
            <label>
              Days off work
              <input type="number" name="daysOffWork" min="0" step="0.5" readonly />
            </label>
          </div>
          <label>
            Status
            <span class="tri-toggle" role="radiogroup" aria-label="Edit status">
              <label><input type="radio" name="status" value="planning" checked required /><span>Planning</span></label>
              <label><input type="radio" name="status" value="booked" required /><span>Booked</span></label>
              <label><input type="radio" name="status" value="happened" required /><span>Happened</span></label>
            </span>
          </label>
          <div class="form-actions-row">
            <button type="button" id="remove-holiday" class="danger">Remove Trip</button>
            <button type="submit">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <div id="bank-holidays-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="bank-holidays-heading">
      <div class="modal-card">
        <div class="panel-head">
          <h2 id="bank-holidays-heading">Bank Holidays</h2>
          <button id="bank-holidays-cancel" type="button">Close</button>
        </div>
        <p>Manage bank holidays for the selected year. Days off work excludes weekends and these dates.</p>
        <form id="bank-holiday-form" class="grid-form" autocomplete="off" onsubmit="event.preventDefault(); return false;">
          <label>
            Name
            <input type="text" name="name" placeholder="e.g. Spring Bank Holiday" required />
          </label>
          <label>
            Date
            <input type="date" name="holidayDate" required />
          </label>
          <button type="submit">Add Bank Holiday</button>
        </form>
        <div id="bank-holiday-list"></div>
      </div>
    </div>

    <template id="month-template">
      <article class="month-card">
        <h4></h4>
        <div class="days-header">
          <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
        </div>
        <div class="days-grid"></div>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="main.js?v=20260509-26"></script>
  </body>
</html>
